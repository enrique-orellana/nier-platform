services:
  db:
    image: postgres:16-alpine
    container_name: openshorts-db
    environment:
      POSTGRES_DB: openshorts
      POSTGRES_USER: openshorts
      POSTGRES_PASSWORD: openshorts-local
    volumes:
      - openshorts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshorts -d openshorts"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    environment:
      - DATABASE_URL=postgres://openshorts:openshorts-local@db:5432/openshorts
      - AI_PROVIDER=openrouter
      - AI_BASE_URL=https://openrouter.ai/api/v1
      - AI_MODEL=openai/gpt-4o-mini
      - AI_ANALYZE_MODEL=openai/gpt-4o-mini
      - AI_TRANSCRIPTION_PROVIDER=local
      - AI_TRANSCRIPTION_MODEL=openai/whisper-large-v3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - VITE_AI_PROVIDER=openrouter
      - VITE_AI_BASE_URL=https://openrouter.ai/api/v1
      - VITE_AI_MODEL=openai/gpt-4o-mini
      - VITE_AI_ANALYZE_MODEL=openai/gpt-4o-mini
      - VITE_AI_TRANSCRIPTION_PROVIDER=local
      - VITE_AI_TRANSCRIPTION_MODEL=openai/whisper-large-v3
      - VITE_BACKEND_PROXY_TARGET=http://backend:8000
      - VITE_RENDERER_PROXY_TARGET=http://renderer:3100
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  openshorts-db-data:
