services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    environment:
      - AI_PROVIDER=ollama
      - AI_BASE_URL=http://host.docker.internal:11434
      - AI_MODEL=qwen3:latest
      - AI_VISION_MODEL=qwen2.5vl:latest
    restart: unless-stopped

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - VITE_AI_PROVIDER=ollama
      - VITE_AI_BASE_URL=http://localhost:11434
      - VITE_AI_MODEL=qwen3:latest
      - VITE_AI_VISION_MODEL=qwen2.5vl:latest
      - VITE_BACKEND_PROXY_TARGET=http://backend:8000
      - VITE_RENDERER_PROXY_TARGET=http://renderer:3100
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
