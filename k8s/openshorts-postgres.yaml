apiVersion: v1
kind: PersistentVolume
metadata:
  name: microk8s-openshorts-postgres
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /home/ubuntu/kubefiles/openshorts-postgres
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: microk8s-migration
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openshorts-postgres-data
  namespace: openshorts
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: microk8s-migration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshorts-postgres
  namespace: openshorts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshorts-postgres
  template:
    metadata:
      labels:
        app: openshorts-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: openshorts-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: openshorts-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openshorts-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: openshorts-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: openshorts-postgres
  namespace: openshorts
spec:
  type: ClusterIP
  selector:
    app: openshorts-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
