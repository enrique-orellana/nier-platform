apiVersion: v1
kind: Namespace
metadata:
  name: openshorts
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: docker-openshorts-workdir
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: docker-migration
  volumeMode: Filesystem
  hostPath:
    path: /run/desktop/mnt/host/d/openshorts-docker-data/workdir
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - docker-desktop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openshorts-workdir
  namespace: openshorts
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: docker-migration
  volumeMode: Filesystem
  volumeName: docker-openshorts-workdir
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshorts-config
  namespace: openshorts
data:
  MAX_CONCURRENT_JOBS: "5"
  MAX_MINIO_SOURCE_SIZE_MB: "16384"
  SCENE_DETECTION_FRAME_SKIP: "4"
  SCENE_STRATEGY_SAMPLE_COUNT: "1"
  SCENE_STRATEGY_WORKERS: "8"
  OPENSHORTS_DEVICE: "auto"
  AI_PROVIDER: openrouter
  AI_BASE_URL: https://openrouter.ai/api/v1
  AI_QUALITY_PRESET: balanced
  AI_MODEL: openai/gpt-4o-mini
  AI_ANALYZE_MODEL: openai/gpt-4o-mini
  AI_VISION_MODEL: openai/gpt-4o-mini
  AI_IMAGE_MODEL: ""
  AI_TRANSCRIPTION_PROVIDER: local
  AI_TRANSCRIPTION_MODEL: openai/whisper-large-v3
  VITE_AI_PROVIDER: openrouter
  VITE_AI_BASE_URL: https://openrouter.ai/api/v1
  VITE_AI_QUALITY_PRESET: balanced
  VITE_AI_MODEL: openai/gpt-4o-mini
  VITE_AI_ANALYZE_MODEL: openai/gpt-4o-mini
  VITE_AI_VISION_MODEL: openai/gpt-4o-mini
  VITE_AI_IMAGE_MODEL: ""
  VITE_AI_TRANSCRIPTION_PROVIDER: local
  VITE_AI_TRANSCRIPTION_MODEL: openai/whisper-large-v3
  VITE_BACKEND_PROXY_TARGET: http://openshorts-backend:8000
  VITE_RENDERER_PROXY_TARGET: http://openshorts-renderer:3100
  AWS_REGION: eu-west-3
  AWS_S3_BUCKET: openshorts-media
  AWS_S3_PUBLIC_BUCKET: openshorts-media
  AWS_S3_ENDPOINT_URL: http://minio-standalone.minio-system.svc.cluster.local:9000
  AWS_S3_PUBLIC_URL_BASE: http://minio-standalone.openshorts.127.0.0.1.nip.io
  AWS_S3_PUBLIC_ENDPOINT_URL: http://minio-standalone.openshorts.127.0.0.1.nip.io
  AWS_S3_FORCE_PATH_STYLE: "true"
  RENDER_SERVICE_URL: http://openshorts-renderer.openshorts.svc.cluster.local:3100
  OPENSHORTS_CODEX_AUTH_FILE: /app/output/.openshorts/codex-auth.json
  REMOTION_BUNDLE_PATH: /app/remotion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshorts-backend
  namespace: openshorts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshorts-backend
  template:
    metadata:
      labels:
        app: openshorts-backend
    spec:
      containers:
        - name: backend
          image: openshorts-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: openshorts-config
          env:
            - name: PORT
              value: "8000"
            - name: OUTPUT_DIR
              value: /app/output
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openshorts-postgres
                  key: DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openshorts-minio
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openshorts-minio
                  key: AWS_SECRET_ACCESS_KEY
            - name: HSA_ENABLE_DXG_DETECTION
              value: "1"
          volumeMounts:
            - name: workdir
              mountPath: /app/output
            - name: uploads
              mountPath: /app/uploads
            - name: amd-dxg
              mountPath: /dev/dxg
            - name: wsl-dxcore
              mountPath: /usr/lib/libdxcore.so
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "4000m"
              memory: "4Gi"
            limits:
              cpu: "12000m"
              memory: "12Gi"
          securityContext:
            # Docker Desktop Kubernetes cannot express Docker's --device
            # cgroup rule for /dev/dxg; privileged is required for ROCm DXG.
            allowPrivilegeEscalation: true
            privileged: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              add:
                - SYS_PTRACE
            seccompProfile:
              type: Unconfined
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: openshorts-workdir
        - name: uploads
          emptyDir: {}
        - name: amd-dxg
          hostPath:
            path: /dev/dxg
            type: CharDevice
        - name: wsl-dxcore
          hostPath:
            path: /usr/lib/wsl/lib/libdxcore.so
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: openshorts-backend
  namespace: openshorts
spec:
  selector:
    app: openshorts-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshorts-renderer
  namespace: openshorts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshorts-renderer
  template:
    metadata:
      labels:
        app: openshorts-renderer
    spec:
      containers:
        - name: renderer
          image: openshorts-renderer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
          envFrom:
            - configMapRef:
                name: openshorts-config
          env:
            - name: PORT
              value: "3100"
            - name: OUTPUT_DIR
              value: /output
          volumeMounts:
            - name: workdir
              mountPath: /output
          startupProbe:
            httpGet:
              path: /health
              port: 3100
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: openshorts-workdir
---
apiVersion: v1
kind: Service
metadata:
  name: openshorts-renderer
  namespace: openshorts
spec:
  selector:
    app: openshorts-renderer
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshorts-frontend
  namespace: openshorts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshorts-frontend
  template:
    metadata:
      labels:
        app: openshorts-frontend
    spec:
      containers:
        - name: frontend
          image: openshorts-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: openshorts-config
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: openshorts-frontend
  namespace: openshorts
spec:
  selector:
    app: openshorts-frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openshorts
  namespace: openshorts
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-vhost: "openshorts.127.0.0.1.nip.io"
spec:
  ingressClassName: nginx
  rules:
    - host: openshorts.127.0.0.1.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openshorts-backend
                port:
                  number: 8000
          - path: /videos
            pathType: Prefix
            backend:
              service:
                name: openshorts-backend
                port:
                  number: 8000
          - path: /output
            pathType: Prefix
            backend:
              service:
                name: openshorts-renderer
                port:
                  number: 3100
          - path: /thumbnails
            pathType: Prefix
            backend:
              service:
                name: openshorts-backend
                port:
                  number: 8000
          - path: /gallery
            pathType: Prefix
            backend:
              service:
                name: openshorts-backend
                port:
                  number: 8000
          - path: /video
            pathType: Prefix
            backend:
              service:
                name: openshorts-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openshorts-frontend
                port:
                  number: 5173
